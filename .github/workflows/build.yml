name: Build PSBDx DevBrowser (Debug + Release APKs)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The gradle-wrapper.jar binary is generated here rather than
      # committed to the repo, using the Gradle version pinned in
      # gradle/wrapper/gradle-wrapper.properties. This keeps the repo
      # free of committed binary blobs while still producing a normal
      # ./gradlew you can chmod/run in every subsequent step.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Grant Executable Permissions to gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.keystore"
          else
            echo "No KEYSTORE_BASE64 secret set - release build will fall back to debug signing."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSBDx-DevBrowser-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSBDx-DevBrowser-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
